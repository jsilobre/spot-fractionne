# flat-segments pipeline parameters.
# Generated by `flat-segments config`; every value is documented in
# docs/algorithm.md (section 13). Remove a key to keep its default.

[network]
max_deflection_deg = 35.0
bearing_probe_m = 15.0

[profile]
step_m = 5.0
lateral_offset_m = 0.0
structure_margin_m = 5.0
max_gap_fill_m = 20.0
median_window_m = 15.0
gaussian_sigma_m = 10.0
grade_base_m = 20.0
gain_hysteresis_m = 0.5

[detection]
window_step_m = 10.0

[detection.flat]
target_lengths_m = [200.0, 400.0, 1000.0]
max_mean_grade_pct = 1.0
max_local_grade_pct = 2.0
max_sinuosity = 1.2

[detection.flat.weights]
flatness = 0.35
straightness = 0.2
crossings = 0.25
surface = 0.1
lighting = 0.05
length = 0.05

[detection.climb]
target_lengths_m = [100.0, 200.0, 400.0, 800.0]
min_mean_grade_pct = 3.0
max_mean_grade_pct = 50.0
min_local_grade_pct = 1.0
max_flat_stretch_m = 20.0
max_sinuosity = 1.5

[detection.climb.weights]
regularity = 0.35
crossings = 0.3
straightness = 0.1
surface = 0.15
lighting = 0.05
length = 0.05

[detection.long_climb]
target_lengths_m = [1000.0, 1500.0, 2000.0, 3000.0]
min_mean_grade_pct = 2.5
max_mean_grade_pct = 50.0
min_local_grade_pct = 1.0
max_flat_stretch_m = 150.0
max_sinuosity = 3.0

[detection.long_climb.weights]
regularity = 0.35
crossings = 0.3
straightness = 0.1
surface = 0.15
lighting = 0.05
length = 0.05

[detection.dedup]
buffer_m = 20.0
max_overlap = 0.5

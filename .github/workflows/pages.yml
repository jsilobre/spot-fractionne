name: Pages

# Publishes web/ to GitHub Pages. Requires Settings -> Pages -> Source:
# "GitHub Actions" (the first run fails until Pages is enabled).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        working-directory: web
        run: node --test
      - name: Assemble the site (without tests)
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/filters.js web/geocode.js web/tiles.js web/analytics.js web/style.css _site/
          cp -r web/vendor _site/vendor
          cp -r web/data _site/data
      - name: Published data (R2, else the release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          # On R2, only segments.json is deployed: it points to the tiles and the
          # index there (ADR 0013). Without data, the page falls back on the sample.
          if [ -n "$R2_PUBLIC_URL" ] && curl -sSf -o r2-segments.json "${R2_PUBLIC_URL%/}/segments.json"; then
            cp r2-segments.json _site/data/segments.json
          elif gh release download data-latest --dir release; then
            cp release/segments.pmtiles release/segments.json _site/data/
            rm -rf _site/data/ids
            tar -xzf release/ids.tar.gz -C _site/data
          fi
          du -sh _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Pages

# Publishes web/ (ADR 0017):
# - on Cloudflare (Workers static assets + the comments Worker, wrangler.jsonc,
#   ADR 0019) when the variable
#   CLOUDFLARE_ACCOUNT_ID and the secret CLOUDFLARE_API_TOKEN are set;
# - on GitHub Pages: the whole site, or, once the variable SITE_URL names the
#   site's own address, a page that redirects old links there (keeping ?id=).
# GitHub Pages requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        working-directory: web
        run: node --test
      - name: Tests of the Worker
        working-directory: worker
        run: node --test
      - name: Assemble the site (without tests)
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/basemaps.js web/coursestyle.js web/filters.js web/geocode.js web/route.js web/profile.js web/comments.js web/moderation.html web/moderation.js web/tiles.js web/analytics.js web/pwa.js web/sw.js web/style.css web/manifest.webmanifest _site/
          cp -r web/vendor _site/vendor
          cp -r web/icons _site/icons
          cp -r web/data _site/data
      - name: Published data (R2, else the release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          # On R2, only segments.json is deployed: it points to the tiles and the
          # index there (ADR 0013). Without data, the page falls back on the sample.
          if [ -n "$R2_PUBLIC_URL" ] && curl -sSf -o r2-segments.json "${R2_PUBLIC_URL%/}/segments.json"; then
            cp r2-segments.json _site/data/segments.json
          elif gh release download data-latest --dir release; then
            cp release/segments.pmtiles release/segments.json _site/data/
            rm -rf _site/data/ids
            tar -xzf release/ids.tar.gz -C _site/data
          fi
          du -sh _site/data
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
      - name: Redirect to the site's own address (old github.io links)
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          mkdir -p _redirect
          sed "s|__SITE_URL__|$SITE_URL|g" web/redirect/index.html > _redirect/index.html
          cp _redirect/index.html _redirect/404.html
          cp web/redirect/sw.js _redirect/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.SITE_URL != '' && '_redirect' || '_site' }}

  cloudflare:
    needs: build
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Comments database (D1 migrations not applied yet)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.144.0 d1 migrations apply DB --remote
      - name: Deploy on Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          # Worker secrets of the comments API (ADR 0019), kept as GitHub
          # secrets and uploaded with each deploy. An empty one is left out:
          # the value already on Cloudflare stays.
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ADMIN_TOKEN: ${{ secrets.COMMENTS_ADMIN_TOKEN }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          jq -n 'env | {TURNSTILE_SECRET, ADMIN_TOKEN} | with_entries(select(.value != null and .value != ""))' > "$secrets"
          npx --yes wrangler@4.144.0 deploy --secrets-file "$secrets"
          rm -f "$secrets"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

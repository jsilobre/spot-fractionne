name: Production

# Phase 2.4 (ADR 0011): computes départements in parallel, then publishes the
# tileset on Cloudflare R2 (ADR 0013), or in the release "data-latest" when
# the repository has no R2 settings. The Pages workflow then deploys the site.
# 0. storage: checks the R2 bucket (write, public partial reads, CORS);
# 1. prepare: France OSM extract (Geofabrik, else the openstreetmap.fr
#    mirror), nodes renumbered (osmium needs memory in proportion to the
#    largest node id), cut per département into the release "osm-extracts";
# 2. department: one job per département (OSM extract, DEM, segments);
# 3. assemble: export-pmtiles with the ids of the published version kept
#    (ADR 0012), then publication. On R2, each version has its own file names
#    (a browser never mixes two versions) and the two latest are kept. A failed département blocks it: rerun the
#    failed jobs, the others keep their results.
# With reuse_run, only the assembly runs, on the départements of an earlier
# run (its artifacts are kept 7 days): to republish after a fix in the export.
# With keep_run, only the listed départements are computed, and the assembly
# takes the others from that earlier run: to redo a few départements.
on:
  workflow_dispatch:
    inputs:
      departments:
        description: "INSEE codes separated by spaces, or 'all' (metropolitan France)"
        default: "09 12 31 32 46 65 81 82"
      publish:
        description: "Publish the result (release data-latest, then the site)"
        type: boolean
        default: true
      max_parallel:
        description: "Départements computed at once (each sends 4 requests at a time to the IGN)"
        default: "4"
      reuse_run:
        description: "Only assemble, from the départements of this earlier run id (departments is then ignored)"
        default: ""
      keep_run:
        description: "Assemble the départements computed now with the other ones of this earlier run id"
        default: ""

permissions:
  contents: write # releases
  actions: write # start the Pages workflow

concurrency:
  group: production
  cancel-in-progress: false

env:
  OSM_URL: https://download.geofabrik.de/europe/france-latest.osm.pbf
  OSM_MIRROR_URL: https://download.openstreetmap.fr/extracts/europe/france.osm.pbf
  EXTRACTS_RELEASE: osm-extracts
  DATA_RELEASE: data-latest
  WORK: /mnt/work # the larger disk of the runners
  GH_TOKEN: ${{ github.token }}

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      r2: ${{ steps.check.outputs.r2 }}
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - name: Check the R2 bucket (write, public partial read with CORS, delete)
        id: check
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "No R2 settings: publication in the release $DATA_RELEASE."
            echo "r2=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          R2_PUBLIC_URL=${R2_PUBLIC_URL%/}
          key="checks/run-$GITHUB_RUN_ID.txt"
          echo "flat-segments storage check, run $GITHUB_RUN_ID" > check.txt
          aws s3 cp check.txt "s3://$R2_BUCKET/$key" --only-show-errors
          headers=$(curl -sS -D - -o /dev/null -H "Origin: $PAGES_ORIGIN" -H "Range: bytes=0-12" \
            "$R2_PUBLIC_URL/$key" | tr -d '\r')
          aws s3 rm "s3://$R2_BUCKET/$key" --only-show-errors
          echo "$headers"
          grep -q '^HTTP/[0-9.]* 206' <<< "$headers" \
            || { echo "::error::$R2_PUBLIC_URL does not serve partial reads (206)"; exit 1; }
          grep -qiE "^access-control-allow-origin: (\*|$PAGES_ORIGIN)" <<< "$headers" \
            || { echo "::error::CORS: $R2_PUBLIC_URL does not allow $PAGES_ORIGIN"; exit 1; }
          echo "r2=true" >> "$GITHUB_OUTPUT"

  prepare:
    needs: storage
    if: inputs.reuse_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      codes: ${{ steps.codes.outputs.codes }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Install dependencies
        run: uv sync --locked
      - name: Work folder
        run: |
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / "$WORK"
      - name: Département outlines (IGN Admin Express)
        run: uv run flat-segments download-departments
      - name: Départements to compute
        id: codes
        env:
          INPUT: ${{ inputs.departments }}
        run: |
          if [ "$INPUT" = all ]; then
            codes=$(uv run flat-segments department-codes)
          else
            # shellcheck disable=SC2086 # one argument per code
            codes=$(uv run flat-segments department-codes $INPUT)
          fi
          echo "codes=$codes" >> "$GITHUB_OUTPUT"
          echo "Départements: $codes" >> "$GITHUB_STEP_SUMMARY"
      - name: OSM extract of France
        run: |
          uv run flat-segments download-osm --url "$OSM_URL" --out-dir "$WORK" --no-clip \
            || uv run flat-segments download-osm --url "$OSM_MIRROR_URL" --out-dir "$WORK" --no-clip
          ls -l "$WORK"
      - name: Number the nodes from 1 (memory of the cut, see osm_extracts.py)
        run: |
          france=$(ls "$WORK"/france*.osm.pbf)
          uv run flat-segments renumber-osm "$france" "$WORK/renumbered.osm.pbf"
          rm "$france"
      - name: Cut per département, upload to the release osm-extracts
        env:
          CODES: ${{ steps.codes.outputs.codes }}
        run: |
          gh release view "$EXTRACTS_RELEASE" > /dev/null 2>&1 \
            || gh release create "$EXTRACTS_RELEASE" --prerelease --title "Extraits OSM par département" \
                 --notes "Fichiers intermédiaires du workflow Production (ADR 0011), remplacés à chaque lancement."
          gh release upload "$EXTRACTS_RELEASE" data/raw/departements.geojson --clobber
          france="$WORK/renumbered.osm.pbf"
          mapfile -t all < <(jq -r '.[]' <<< "$CODES")
          # Batches of 12: one pass over France each, then upload and free the disk.
          for ((k = 0; k < ${#all[@]}; k += 12)); do
            uv run flat-segments cut-osm "$france" "${all[@]:k:12}" --out-dir "$WORK/osm"
            gh release upload "$EXTRACTS_RELEASE" "$WORK"/osm/*.osm.pbf --clobber
            rm "$WORK"/osm/*.osm.pbf
          done

  department:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        code: ${{ fromJSON(needs.prepare.outputs.codes) }}
    env:
      CODE: ${{ matrix.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Inputs (OSM extract, outlines)
        run: |
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          gh release download "$EXTRACTS_RELEASE" --dir data/raw --clobber \
            --pattern "$CODE.osm.pbf" --pattern departements.geojson
      - name: Compute the département
        run: |
          uv run flat-segments department "$CODE" --pbf "data/raw/$CODE.osm.pbf" \
            --root "$WORK/departments"
          df -h "$WORK"
      - uses: actions/upload-artifact@v4
        with:
          name: segments-${{ matrix.code }}
          retention-days: 7
          path: |
            ${{ env.WORK }}/departments/${{ matrix.code }}/segments.parquet
            ${{ env.WORK }}/departments/${{ matrix.code }}/loops.parquet
            ${{ env.WORK }}/departments/${{ matrix.code }}/segments.params.toml
            ${{ env.WORK }}/departments/${{ matrix.code }}/state.json

  assemble:
    needs: [storage, department]
    # The départements of this run, or those of reuse_run (department skipped).
    if: >-
      !cancelled() && needs.storage.result == 'success'
      && (needs.department.result == 'success'
      || (inputs.reuse_run != '' && needs.department.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2: ${{ needs.storage.outputs.r2 }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: ./.github/actions/tippecanoe
      - name: Install dependencies
        run: uv sync --locked
      - name: Départements of this run
        if: inputs.reuse_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: segments-*
          path: segments
      - name: Other départements, from run ${{ inputs.keep_run }}
        if: inputs.reuse_run == '' && inputs.keep_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: segments-*
          path: kept
          run-id: ${{ inputs.keep_run }}
          github-token: ${{ github.token }}
      - name: Add the départements not computed now
        if: inputs.reuse_run == '' && inputs.keep_run != ''
        run: |
          added=0
          for dir in kept/segments-*; do
            name=$(basename "$dir")
            [ -e "segments/$name" ] || { mv "$dir" "segments/$name"; added=$((added + 1)); }
          done
          echo "$added départements added from run $KEEP_RUN"
        env:
          KEEP_RUN: ${{ inputs.keep_run }}
      - name: Départements of run ${{ inputs.reuse_run }}
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: segments-*
          path: segments
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Published version (to keep its ids)
        run: |
          mkdir previous
          # The object key is the path of a public address.
          key() { local url=${1#*://}; echo "${url#*/}"; }
          if [ "$R2" = true ] && aws s3 cp "s3://$R2_BUCKET/segments.json" previous/ --only-show-errors; then
            aws s3 cp "s3://$R2_BUCKET/$(key "$(jq -r .tiles.url previous/segments.json)")" \
              previous/segments.pmtiles --only-show-errors
            aws s3 sync "s3://$R2_BUCKET/$(key "$(jq -r .tiles.index previous/segments.json)")" \
              previous/ids --only-show-errors
          elif gh release download "$DATA_RELEASE" --dir previous; then
            tar -xzf previous/ids.tar.gz -C previous
          else
            echo "No published version: every id is new."
          fi
          ls previous
      - name: Tileset
        run: |
          set -o pipefail
          R2_PUBLIC_URL=${R2_PUBLIC_URL%/}
          version=$(date -u +%Y%m%dT%H%M%SZ)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          addresses=()
          if [ "$R2" = true ]; then
            addresses=(--tiles-url "$R2_PUBLIC_URL/tiles/segments-$version.pmtiles"
                       --index-url "$R2_PUBLIC_URL/ids/$version")
          fi
          timer=()
          [ -x /usr/bin/time ] && timer=(/usr/bin/time -f "export: %e s, max memory %M KB")
          "${timer[@]}" uv run flat-segments export-pmtiles segments/*/segments.parquet \
            --previous previous --out-dir out "${addresses[@]}" 2>&1 | tee export.log
          tar -czf ids.tar.gz -C out ids
      - name: Summary
        run: |
          {
            echo "## Départements"
            uv run flat-segments department-summary segments/*/state.json
            echo
            echo "## Jeu publié"
            echo '```'
            cat export.log
            du -h out/segments.pmtiles out/segments.json ids.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish on R2 (two latest versions kept), then the site
        if: inputs.publish && env.R2 == 'true'
        run: |
          immutable="public, max-age=31536000, immutable"
          aws s3 cp out/segments.pmtiles "s3://$R2_BUCKET/tiles/segments-$VERSION.pmtiles" \
            --cache-control "$immutable" --content-type application/octet-stream --only-show-errors
          aws s3 sync out/ids "s3://$R2_BUCKET/ids/$VERSION" \
            --cache-control "$immutable" --content-type application/json --only-show-errors
          aws s3 cp out/segments.json "s3://$R2_BUCKET/segments.json" \
            --cache-control "no-cache" --content-type application/json --only-show-errors
          mapfile -t versions < <(aws s3 ls "s3://$R2_BUCKET/tiles/" \
            | sed -n 's/.* segments-\(.*\)\.pmtiles$/\1/p' | sort)
          if (( ${#versions[@]} > 2 )); then
            for old in "${versions[@]:0:${#versions[@]}-2}"; do
              aws s3 rm "s3://$R2_BUCKET/tiles/segments-$old.pmtiles" --only-show-errors
              aws s3 rm "s3://$R2_BUCKET/ids/$old/" --recursive --only-show-errors
            done
          fi
          echo "Published version $VERSION on R2"
          gh workflow run pages.yml --ref main
      - name: Publish (release data-latest, then the site)
        if: inputs.publish && env.R2 != 'true'
        run: |
          gh release view "$DATA_RELEASE" > /dev/null 2>&1 \
            || gh release create "$DATA_RELEASE" --prerelease --title "Données publiées" \
                 --notes "Jeu publié par le workflow Production (ADR 0011), déployé par le workflow Pages."
          gh release upload "$DATA_RELEASE" out/segments.pmtiles out/segments.json ids.tar.gz --clobber
          gh workflow run pages.yml --ref main
      - name: Keep the tileset for inspection (not published)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: tileset
          retention-days: 7
          path: |
            out/segments.pmtiles
            out/segments.json
            ids.tar.gz
